<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Current Swipe | Smooth Flow</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #6366f1;
      --secondary: #06b6d4;
      --glass-border: rgba(255, 255, 255, 0.14);
      --danger: #f43f5e;
      --gold: #f59e0b;
      --pill-blue: #2563eb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #000; font-family: 'Inter', sans-serif; overflow: hidden; color: white; -webkit-font-smoothing: antialiased; }

    #login { position: fixed; inset: 0; z-index: 10000; background: radial-gradient(circle at 20% 0%, #2e1065 0%, #000 55%), radial-gradient(circle at 100% 100%, #083344 0%, transparent 50%); display: flex; justify-content: center; align-items: center; }
    .login-card { width: 90%; max-width: 380px; padding: 48px 32px; background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(30px); border: 1px solid var(--glass-border); border-radius: 32px; text-align: center; box-shadow: 0 30px 80px -20px rgba(99,102,241,0.35); }
    .login-glyph { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-size: 26px; box-shadow: 0 10px 30px -8px rgba(6,182,212,0.6); }
    .login-card input:focus { border-color: var(--secondary); }
    .login-card button:active { transform: scale(0.97); }

    #container {
        height: 100vh;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        scroll-behavior: smooth;
        scrollbar-width: none;
        -ms-overflow-style: none;
        overscroll-behavior-y: contain;
    }
    #container::-webkit-scrollbar { display: none; }

    .reel {
        height: 100vh;
        width: 100%;
        position: relative;
        scroll-snap-align: start;
        scroll-snap-stop: always;
        will-change: transform;
        overflow: hidden;
    }
    .reel img { width: 100%; height: 100%; object-fit: cover; user-select: none; }
    .vignette { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 24%, transparent 55%, rgba(0,0,0,0.95) 100%); pointer-events: none; }

    .heart-burst { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); font-size: 96px; color: #fff; text-shadow: 0 6px 30px rgba(0,0,0,0.5); pointer-events: none; z-index: 60; animation: burst 0.75s cubic-bezier(.2,1.4,.4,1) forwards; }
    @keyframes burst { 0% { transform: translate(-50%,-50%) scale(0); opacity: 1;} 35% { transform: translate(-50%,-50%) scale(1.15); opacity: 1;} 100% { transform: translate(-50%,-50%) scale(1); opacity: 0;} }

    .top-bar { position: absolute; top: 0; left: 0; right: 0; z-index: 80; padding: max(14px, env(safe-area-inset-top)) 18px 40px; background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent); }
    .story-track { display: flex; gap: 6px; margin-bottom: 14px; }
    .story-seg { flex: 1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.28); overflow: hidden; }
    .story-seg.done { background: rgba(255,255,255,0.75); }
    .story-seg.active { background: rgba(255,255,255,0.95); }
    .brand-row { display: flex; align-items: center; justify-content: space-between; }
    .brand-name { font-weight: 800; font-size: 21px; letter-spacing: -0.02em; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
    .search-btn { position: relative; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; cursor: pointer; }
    .search-btn:active { opacity: 0.6; }
    .noti-dot { position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; background: var(--danger); border-radius: 50%; display: none; box-shadow: 0 0 0 2px #000; }

    #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); z-index: 997; display: none; }
    .sidebar, .noti-pane { position: fixed; top: 0; height: 100%; background: #0a0a0c; z-index: 998; transition: 0.32s cubic-bezier(.25,1,.4,1); border: 1px solid var(--glass-border); }
    .sidebar { left: -320px; width: 300px; padding: 100px 22px 24px; }
    .sidebar.open { left: 0; }
    .noti-pane { right: -350px; width: 320px; padding: 100px 20px 24px; }
    .noti-pane.open { right: 0; }
    .nav-item { display: flex; align-items: center; gap: 15px; padding: 15px 16px; border-radius: 16px; color: #7c8494; cursor: pointer; margin-bottom: 6px; font-weight: 600; font-size: 14.5px; transition: background .15s, color .15s; }
    .nav-item.active { background: rgba(255,255,255,0.08); color: white; border: 1px solid var(--glass-border); }
    .nav-item:active { background: rgba(255,255,255,0.14); }

    .actions { position: absolute; right: 14px; bottom: 152px; display: flex; flex-direction: column; align-items: center; gap: 16px; z-index: 50; }
    .action-item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
    .action-square { width: 46px; height: 46px; background: rgba(0,0,0,0.38); backdrop-filter: blur(14px); border-radius: 15px; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; font-size: 19px; transition: transform 0.12s ease; }
    .action-square:active { transform: scale(0.88); }
    .action-square.liked { color: var(--danger); }
    .action-square.saved { color: var(--gold); }
    .action-count { font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px rgba(0,0,0,0.6); }

    .caption-block { position: absolute; bottom: 84px; left: 20px; right: 78px; }
    .category-pill { display: inline-block; background: var(--pill-blue); color: white; font-size: 10.5px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; padding: 6px 13px; border-radius: 999px; margin-bottom: 12px; }
    .headline { font-size: 22px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em; text-shadow: 0 2px 12px rgba(0,0,0,0.45); margin-bottom: 8px; }
    .subtext { font-size: 14px; color: rgba(255,255,255,0.82); line-height: 1.5; margin-bottom: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .cta-row { display: flex; align-items: center; gap: 12px; }
    .read-story-btn { background: white; color: #0a0a0c; font-weight: 800; font-size: 14.5px; padding: 13px 26px; border-radius: 999px; border: none; cursor: pointer; }
    .read-story-btn:active { transform: scale(0.97); }
    .chevron-hint { color: rgba(255,255,255,0.65); font-size: 15px; animation: chevbounce 1.8s ease-in-out infinite; }
    @keyframes chevbounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(5px); } }

    .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 1005; background: #000; border-top: 1px solid rgba(255,255,255,0.08); display: flex; padding: 10px 8px max(10px, env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(0,0,0,0.5); }
    .bn-item { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 0; color: rgba(255,255,255,0.45); font-size: 21px; cursor: pointer; transition: color .15s, transform .1s; }
    .bn-item.active { color: white; }
    .bn-item:active { transform: scale(0.9); }

    /* PROFILE CARD (sidebar) */
    .profile-card { display: flex; align-items: center; gap: 14px; margin-bottom: 22px; }
    .profile-avatar { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border); display: flex; align-items: center; justify-content: center; font-size: 23px; color: rgba(255,255,255,0.75); flex-shrink: 0; }
    .profile-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.4); font-weight: 700; margin-bottom: 3px; }
    .profile-number { font-size: 16.5px; font-weight: 800; }
    .sidebar-divider { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 0 20px; }

    #requestModal, #commentModal { position: fixed; inset: 0; z-index: 2200; background: rgba(0,0,0,0.72); backdrop-filter: blur(12px); display: none; }
    #requestModal { justify-content: center; align-items: center; }

    /* STORY DETAIL */
    .story-modal { position: fixed; inset: 0; z-index: 2100; background: #050505; display: none; transform: translateY(100%); transition: transform 0.35s cubic-bezier(.25,1,.4,1); }
    .story-modal.open { transform: translateY(0); }
    .story-sheet { height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .story-hero { position: relative; height: 38vh; background: #111; }
    .story-hero img { width: 100%; height: 100%; object-fit: cover; }
    .story-hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(5,5,5,1)); }
    .story-back { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; color: white; z-index: 2; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); }
    .story-back:active { transform: scale(0.9); }
    .story-body { padding: 20px 22px max(40px, env(safe-area-inset-bottom)); position: relative; }
    .story-headline { font-size: 25px; font-weight: 800; line-height: 1.3; margin: 10px 0 6px; }
    .story-meta { font-size: 12px; color: rgba(255,255,255,0.42); font-weight: 700; margin-bottom: 20px; letter-spacing: 0.02em; }
    .story-content { font-size: 15px; line-height: 1.8; color: rgba(255,255,255,0.86); white-space: pre-line; margin-bottom: 28px; }

    #commentModal { align-items: flex-end; justify-content: center; }
    .comment-sheet { width: 100%; max-width: 480px; height: 72vh; background: #0b0b0e; border: 1px solid var(--glass-border); border-bottom: none; border-radius: 26px 26px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.32s cubic-bezier(.25,1,.4,1); }
    #commentModal.open .comment-sheet { transform: translateY(0); }
    .drag-handle { width: 40px; height: 4px; background: rgba(255,255,255,0.25); border-radius: 4px; margin: 12px auto 6px; }
    .comment-list { flex: 1; overflow-y: auto; padding: 6px 20px; }
    .comment-row { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex-shrink: 0; }
    .comment-input-bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; padding-bottom: max(14px, env(safe-area-inset-bottom)); border-top: 1px solid var(--glass-border); background: #0b0b0e; }
    .comment-input-bar input { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); border-radius: 999px; padding: 12px 18px; color: white; outline: none; font-size: 14px; }
    .comment-input-bar input:focus { border-color: var(--secondary); }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: linear-gradient(135deg, var(--secondary), var(--primary)); border: none; color: white; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .15s, transform .1s; }
    .send-btn:disabled { opacity: 0.35; }
    .send-btn:active:not(:disabled) { transform: scale(0.9); }
    .pending-badge { font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--gold); background: rgba(245,158,11,0.14); border: 1px solid rgba(245,158,11,0.35); padding: 2px 7px; border-radius: 99px; margin-left: 8px; }

    #toastHost { position: fixed; bottom: max(84px, calc(env(safe-area-inset-bottom) + 84px)); left: 50%; transform: translateX(-50%); z-index: 4000; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
    .toast { background: rgba(20,20,24,0.92); border: 1px solid var(--glass-border); backdrop-filter: blur(16px); padding: 12px 20px; border-radius: 999px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 30px -8px rgba(0,0,0,0.6); animation: toastIn .25s ease, toastOut .25s ease 1.8s forwards; }
    @keyframes toastIn { from { opacity:0; transform: translateY(10px);} to {opacity:1; transform: translateY(0);} }
    @keyframes toastOut { to { opacity:0; transform: translateY(-6px);} }
  </style>
</head>
<body>

  <div id="login">
    <div class="login-card">
      <div class="login-glyph"><i class="fa-solid fa-bolt"></i></div>
      <h1 class="text-3xl font-black mb-1 italic">Current<span class="text-cyan-400">Swipe</span></h1>
      <p class="text-xs text-white/40 mb-7 font-medium">Swipe. React. Connect.</p>
      <input id="mobileInput" type="tel" placeholder="Mobile Number" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl mb-4 text-white outline-none">
      <button id="loginBtn" class="w-full p-4 bg-gradient-to-r from-indigo-600 to-cyan-500 rounded-2xl font-bold uppercase text-sm tracking-wide">Enter App</button>
    </div>
  </div>

  <div id="requestModal">
    <div class="bg-[#111] p-8 border border-white/10 rounded-[32px] w-[90%] max-w-[350px]">
      <h2 class="text-xl font-bold mb-1">Send Request</h2>
      <p id="reqPostName" class="text-cyan-400 text-[10px] mb-6 uppercase font-bold tracking-widest"></p>
      <input id="userName" placeholder="Full Name" class="w-full p-4 bg-white/5 border border-white/10 rounded-2xl mb-4 text-white outline-none">
      <div class="flex gap-2">
        <button onclick="closeRequest()" class="flex-1 p-4 bg-white/5 rounded-2xl text-sm font-semibold">Back</button>
        <button onclick="submitRequest()" class="flex-1 p-4 bg-cyan-500 rounded-2xl text-sm font-bold">Submit</button>
      </div>
    </div>
  </div>

  <div id="commentModal">
    <div class="comment-sheet">
      <div class="drag-handle"></div>
      <div class="flex items-center justify-between px-5 pb-3 border-b border-white/10">
        <h2 class="text-[15px] font-bold">Comments</h2>
        <div class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center cursor-pointer" onclick="closeComments()"><i class="fa-solid fa-xmark text-sm"></i></div>
      </div>
      <div id="commentList" class="comment-list"></div>
      <div class="comment-input-bar">
        <div class="comment-avatar" id="myAvatar">Y</div>
        <input id="commentInput" placeholder="Add a comment..." maxlength="280" oninput="onCommentInputChange()">
        <button class="send-btn" id="sendCommentBtn" disabled onclick="submitComment()"><i class="fa-solid fa-paper-plane text-[15px]"></i></button>
      </div>
    </div>
  </div>

  <div id="storyModal" class="story-modal">
    <div class="story-sheet">
      <div class="story-hero">
        <img id="storyImg" src="">
        <div class="story-back" onclick="closeStory()"><i class="fa-solid fa-arrow-left"></i></div>
      </div>
      <div class="story-body">
        <span class="category-pill" id="storyCategory"></span>
        <h1 class="story-headline" id="storyHeadline"></h1>
        <p class="story-meta" id="storyMeta"></p>
        <div class="story-content" id="storyContent"></div>
        <button class="read-story-btn" onclick="openRequestFromStory()">Send Request</button>
      </div>
    </div>
  </div>

  <div id="overlay"></div>

  <div id="sidebar" class="sidebar">
    <div class="profile-card">
      <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
      <div>
        <p class="profile-label">Mobile Number</p>
        <p class="profile-number" id="profileNumber">—</p>
      </div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="nav-item text-rose-500" id="navLogout"><i class="fa-solid fa-right-from-bracket w-4 text-center"></i> Logout</div>
  </div>

  <div id="notiPane" class="noti-pane">
    <h2 class="text-xl font-bold mb-6">Recent Alerts</h2>
    <div id="notiList" class="space-y-4"></div>
  </div>

  <div id="container"></div>

  <div class="bottom-nav">
    <div class="bn-item active" id="bnHome"><i class="fa-solid fa-house"></i></div>
    <div class="bn-item" id="bnExplore"><i class="fa-solid fa-compass"></i></div>
    <div class="bn-item" id="bnSaved"><i class="fa-regular fa-square-play"></i></div>
    <div class="bn-item" id="bnProfile"><i class="fa-regular fa-user"></i></div>
  </div>

  <div id="toastHost"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, setDoc, updateDoc, arrayUnion, arrayRemove, query, orderBy, limit, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDD9hS0jRiKDUP6-tv6J1xghs-bwi5Cods",
        authDomain: "reels-f0d24.firebaseapp.com",
        projectId: "reels-f0d24"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let userId = localStorage.getItem("userId");
    let allReels = [], userData = { liked: [], saved: [] }, activeReqPost = "";
    let allComments = [], activeCommentReelId = null;
    let currentMode = "home";

    const escapeHtml = (str) => (str || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const initialOf = (str) => (str || "?").trim().charAt(0).toUpperCase() || "?";
    const formatCount = (n) => n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'') + "k" : String(n);
    const timeAgo = (ts) => {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 60) return "now";
      if (s < 3600) return Math.floor(s/60) + "m";
      if (s < 86400) return Math.floor(s/3600) + "h";
      return Math.floor(s/86400) + "d";
    };
    window.showToast = (msg) => {
      const t = document.createElement("div");
      t.className = "toast";
      t.innerText = msg;
      toastHost.appendChild(t);
      setTimeout(() => t.remove(), 2100);
    };

    const approvedCommentCount = (reelId) => allComments.filter(c => c.postId === reelId && c.approved).length;

    const render = () => {
      let data = allReels;
      if(currentMode === "liked") data = allReels.filter(r => userData.liked?.includes(r.id));
      if(currentMode === "saved") data = allReels.filter(r => userData.saved?.includes(r.id));

      container.innerHTML = data.length ? data.map(item => `
        <div class="reel">
          <img src="${item.image}" ondblclick="burstLike(this,'${item.id}')">
          <div class="vignette"></div>

          <div class="top-bar">
            <div class="story-track">
              <div class="story-seg done"></div>
              <div class="story-seg active"></div>
              <div class="story-seg"></div>
            </div>
            <div class="brand-row">
              <span class="brand-name">CurrentSwipe</span>
              <div class="search-btn" onclick="openNotis()"><i class="fa-solid fa-magnifying-glass"></i><div class="noti-dot" id="notiDot"></div></div>
            </div>
          </div>

          <div class="actions">
            <div class="action-item">
              <div class="action-square ${userData.liked?.includes(item.id) ? 'liked' : ''}" onclick="toggleAction('${item.id}', 'liked')">
                <i class="fa-solid fa-heart"></i>
              </div>
              <span class="action-count">${formatCount((item.likeBase||0) + (userData.liked?.includes(item.id) ? 1 : 0))}</span>
            </div>
            <div class="action-item">
              <div class="action-square" onclick="openComments('${item.id}')">
                <i class="fa-solid fa-comment-dots"></i>
              </div>
              <span class="action-count">${formatCount(approvedCommentCount(item.id))}</span>
            </div>
            <div class="action-item">
              <div class="action-square" onclick="sharePost('${escapeHtml(item.title)}')">
                <i class="fa-solid fa-share"></i>
              </div>
            </div>
            <div class="action-item">
              <div class="action-square ${userData.saved?.includes(item.id) ? 'saved' : ''}" onclick="toggleAction('${item.id}', 'saved')">
                <i class="fa-solid fa-bookmark"></i>
              </div>
            </div>
          </div>

          <div class="caption-block">
            <span class="category-pill">${escapeHtml(item.category || 'Feed')}</span>
            <p class="headline">${escapeHtml(item.title)}</p>
            ${item.description ? `<p class="subtext">${escapeHtml(item.description)}</p>` : ''}
            <div class="cta-row">
              <button class="read-story-btn" onclick="openStory('${item.id}')">Read Story</button>
              <i class="fa-solid fa-chevron-down chevron-hint"></i>
            </div>
          </div>
        </div>
      `).join('') : `<div class="h-screen flex items-center justify-center text-slate-500 text-sm font-medium">Nothing here yet</div>`;

      if (activeCommentReelId) renderComments();
    };

    // REQUEST SYSTEM
    window.openRequest = (title) => {
        activeReqPost = title;
        reqPostName.innerText = title;
        requestModal.style.display = 'flex';
    };
    window.closeRequest = () => requestModal.style.display = 'none';
    window.submitRequest = async () => {
        const name = userName.value.trim();
        if(!name) return;
        await addDoc(collection(db, "requests"), { userName: name, userMobile: userId, postTitle: activeReqPost, time: Date.now() });
        showToast("Request sent");
        userName.value = "";
        closeRequest();
    };

    // STORY DETAIL
    let activeStoryItem = null;
    window.openStory = (id) => {
      const item = allReels.find(r => r.id === id);
      if (!item) return;
      activeStoryItem = item;
      storyImg.src = item.image;
      storyCategory.innerText = item.category || 'Feed';
      storyHeadline.innerText = item.title;
      storyMeta.innerText = (item.category || 'Feed') + ' · CurrentSwipe';
      storyContent.innerText = item.content || item.description || 'The full write-up for this story isn\'t published yet. Tap Send Request below and we\'ll get more details over to you.';
      storyModal.style.display = 'block';
      requestAnimationFrame(() => storyModal.classList.add('open'));
    };
    window.closeStory = () => {
      storyModal.classList.remove('open');
      setTimeout(() => { storyModal.style.display = 'none'; }, 350);
    };
    window.openRequestFromStory = () => { if (activeStoryItem) openRequest(activeStoryItem.title); };

    // SHARE
    window.sharePost = async (title) => {
      const shareData = { title, text: title, url: location.href };
      if (navigator.share) {
        try { await navigator.share(shareData); } catch (e) {}
      } else {
        try { await navigator.clipboard.writeText(location.href); showToast("Link copied"); } catch (e) { showToast("Unable to share"); }
      }
    };

    // LIKE / SAVE
    window.toggleAction = async (id, field) => {
      const isPresent = userData[field]?.includes(id);
      await updateDoc(doc(db, "users", userId), { [field]: isPresent ? arrayRemove(id) : arrayUnion(id) });
    };

    window.burstLike = (imgEl, id) => {
      if (!userData.liked?.includes(id)) toggleAction(id, "liked");
      const heart = document.createElement("div");
      heart.className = "heart-burst";
      heart.innerHTML = '<i class="fa-solid fa-heart"></i>';
      imgEl.parentElement.appendChild(heart);
      setTimeout(() => heart.remove(), 750);
    };

    // COMMENTS
    window.openComments = (reelId) => {
      activeCommentReelId = reelId;
      myAvatar.innerText = initialOf(userId);
      commentInput.value = "";
      sendCommentBtn.disabled = true;
      renderComments();
      commentModal.style.display = "flex";
      requestAnimationFrame(() => commentModal.classList.add("open"));
    };
    window.closeComments = () => {
      commentModal.classList.remove("open");
      setTimeout(() => { commentModal.style.display = "none"; activeCommentReelId = null; }, 300);
    };
    window.onCommentInputChange = () => {
      sendCommentBtn.disabled = commentInput.value.trim().length === 0;
    };
    const renderComments = () => {
      const list = allComments
        .filter(c => c.postId === activeCommentReelId && (c.approved || c.userMobile === userId))
        .sort((a,b) => a.time - b.time);

      commentList.innerHTML = list.length ? list.map(c => `
        <div class="comment-row" style="${c.approved ? '' : 'opacity:0.55;'}">
          <div class="comment-avatar">${initialOf(c.userName || c.userMobile)}</div>
          <div class="flex-1 min-w-0">
            <p class="text-[13px] font-bold">${escapeHtml(c.userName || 'Guest')} ${c.approved ? '' : '<span class="pending-badge">Pending</span>'}</p>
            <p class="text-[13.5px] text-white/85 mt-0.5 break-words">${escapeHtml(c.text)}</p>
            <p class="text-[10.5px] text-white/35 mt-1">${timeAgo(c.time)}</p>
          </div>
        </div>
      `).join('') : `<div class="h-full flex flex-col items-center justify-center text-center py-16 text-white/35"><i class="fa-regular fa-comments text-3xl mb-3"></i><p class="text-[13px] font-medium">No comments yet</p><p class="text-[11.5px]">Be the first to say something</p></div>`;
    };
    window.submitComment = async () => {
      const text = commentInput.value.trim();
      if (!text || !activeCommentReelId) return;
      sendCommentBtn.disabled = true;
      await addDoc(collection(db, "comments"), {
        postId: activeCommentReelId,
        userName: userId,
        userMobile: userId,
        text,
        time: Date.now(),
        approved: false
      });
      commentInput.value = "";
      showToast("Comment sent for review");
    };

    const closeAll = () => {
      sidebar.classList.remove("open");
      notiPane.classList.remove("open");
      overlay.style.display = "none";
    };

    window.openNotis = () => { notiPane.classList.add("open"); overlay.style.display = "block"; document.querySelectorAll('#notiDot').forEach(d => d.style.display = "none"); };

    const loadApp = () => {
      onSnapshot(doc(db, "users", userId), s => {
        userData = s.data() || {liked:[], saved:[]};
        render();
      });
      onSnapshot(collection(db, "reels"), s => {
        allReels = s.docs.map(d => ({id:d.id, ...d.data()}));
        render();
      });
      onSnapshot(collection(db, "comments"), s => {
        allComments = s.docs.map(d => ({id:d.id, ...d.data()}));
        render();
      });
      onSnapshot(query(collection(db, "notifications"), orderBy("time", "desc"), limit(5)), s => {
        document.querySelectorAll('#notiDot').forEach(d => d.style.display = s.empty ? "none" : "block");
        notiList.innerHTML = s.docs.map(d => `<div class="bg-white/5 p-4 rounded-xl border border-white/5"><p class="text-sm font-bold text-cyan-400">${escapeHtml(d.data().title)}</p><p class="text-xs opacity-60">${escapeHtml(d.data().msg)}</p></div>`).join('');
      });
    };

    // BOTTOM NAV SWITCHING
    const switchMode = (mode, btnId) => {
        currentMode = mode;
        document.querySelectorAll('.bn-item').forEach(el => el.classList.remove('active'));
        document.getElementById(btnId).classList.add('active');
        closeAll();
        container.scrollTop = 0;
        render();
    };

    bnHome.onclick = () => switchMode("home", "bnHome");
    bnExplore.onclick = () => switchMode("liked", "bnExplore");
    bnSaved.onclick = () => switchMode("saved", "bnSaved");
    bnProfile.onclick = () => { profileNumber.innerText = userId || '—'; sidebar.classList.add("open"); overlay.style.display = "block"; };

    overlay.onclick = closeAll;
    navLogout.onclick = () => { localStorage.clear(); location.reload(); };

    loginBtn.onclick = async () => {
      if(!mobileInput.value) return;
      userId = mobileInput.value;
      await setDoc(doc(db, "users", userId), {liked:[], saved:[], registeredAt: Date.now()}, {merge:true});
      localStorage.setItem("userId", userId);
      login.style.display = "none";
      loadApp();
    };

    if(userId) { login.style.display = "none"; loadApp(); }
  </script>
</body>
</html>
